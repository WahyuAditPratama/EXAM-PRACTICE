<script>
const D=[{"n": 1, "d": 5, "t": "Which two statements are correct regarding Layer 2 network switches? (Choose two.)", "o": ["Switches are susceptible to traffic loops.", "Switches flood broadcast traffic.", "Switches do not learn MAC addresses.", "Switches create a single collision domain."], "a": [0, 1]}, {"n": 2, "d": 5, "t": "How many usable hosts are in a /24 subnet mask?", "o": ["250", "254", "255", "256"], "a": [1]}, {"n": 3, "d": 5, "t": "What are two fiber-optic connector types? (Choose two.)", "o": ["LC", "RJ-45", "SC", "BNC"], "a": [0, 2]}, {"n": 4, "d": 5, "t": "Which two characteristics apply to TCP? (Choose two.)", "o": ["TCP guarantees fixed latency for application flows.", "TCP broadcasts datagrams by default on Ethernet.", "TCP uses a three-way handshake to establish a connection.", "TCP provides reliable, ordered delivery using sequence numbers."], "a": [2, 3]}, {"n": 5, "d": 5, "t": "Which statement is correct when Router R1 receives a packet from User A destined for User B as shown in the exhibit?", "o": ["Router R1 replaces the destination IP address in the packet with the IP address of Router R2.", "Router R1 leaves the packet unchanged.", "Router R1 replaces the destination MAC address in the packet with the MAC address of Router R2.", "Router R1 replaces the destination MAC address in the packet with the MAC address of User B."], "a": [2], "x": "User A ──► R1 ─── R2 ─── User B"}, {"n": 6, "d": 5, "t": "You asked a network engineer to configure a new logical interface on a Juniper router. The interface must use the fourth usable host address from the 172.16.40.128/29 subnet. Which IP address is correct in this scenario?", "o": ["172.16.40.135", "172.16.40.132", "172.16.40.130", "172.16.40.131"], "a": [1]}, {"n": 7, "d": 5, "t": "You are asked to subnet the broadcast domains but need to support 50 hosts. In this scenario, which subnet mask would satisfy this requirement?", "o": ["/26", "/27", "/28", "/29"], "a": [0]}, {"n": 8, "d": 5, "t": "Which IPv4 address and subnet mask combination represents a point-to-point link with only two usable host addresses?", "o": ["192.168.1.0/30", "192.168.1.0/29", "192.168.1.0/24", "192.168.1.0/28"], "a": [0]}, {"n": 9, "d": 5, "t": "What is the maximum number of IP addresses that would be assigned to hosts in the 192.168.1.0/24 network?", "o": ["24", "32", "128", "254"], "a": [3]}, {"n": 10, "d": 5, "t": "What are two characteristics of IPv6 addressing? (Choose two.)", "o": ["The IPv6 address is represented by a 128-bit address", "The IPv6 header automatically includes a checksum.", "IPv6 uses ARP to discover neighboring devices.", "IPv6 addresses that begin with fe80 are not routable."], "a": [0, 3]}, {"n": 11, "d": 1, "t": "How are the Routing Engine and the Packet Forwarding Engine components connected?", "o": ["They use shared memory access.", "They use external breakout cables.", "They use an MPLS connection.", "They use an internal Ethernet link."], "a": [3]}, {"n": 12, "d": 1, "t": "Which two statements are correct about Junos OS? (Choose two.)", "o": ["Junos OS provides the ability to run unsigned third-party binaries.", "Junos OS provides modularization of software processes.", "Junos OS combines security and routing policies.", "Junos OS separates the control plane and the forwarding plane."], "a": [1, 3]}, {"n": 13, "d": 3, "t": "An administrator wants to set up a remote user authentication service for the many users that access a Juniper security device. In this scenario, what are two supported authentication protocols? (Choose two.)", "o": ["RADIUS", "TACACS+", "SHA", "IPsec"], "a": [0, 1]}, {"n": 14, "d": 1, "t": "Which two statements are examples of exception traffic? (Choose two.)", "o": ["An IP packet with the Router Alert option set in the IP options field.", "SSH traffic to the local Junos OS device.", "An IP packet that has the IP precedence CoS bits of 111 in the ToS field.", "SSH traffic to a remote server on the Internet."], "a": [0, 1]}, {"n": 15, "d": 3, "t": "You power on a new MX Series router for the first time and connect to the console. You notice that no transit interfaces are passing traffic. In this scenario, which statement is correct?", "o": ["All interfaces are enabled with DHCP client enabled.", "All interfaces are enabled and have an IP address of 10.0.0.1.", "All interfaces are enabled and have an IP address of 10.0.0.1.", "The interfaces are not configured."], "a": [3]}, {"n": 16, "d": 1, "t": "Which two characteristics describe Junos OS software? (Choose two.)", "o": ["Junos OS is a monolithic code base.", "Junos OS supports automation features.", "Junos OS runs only on routers.", "Junos OS uses a modular architecture with independent processes."], "a": [1, 3]}, {"n": 17, "d": 1, "t": "What are two characteristics of transit traffic in Junos OS? (Choose two.)", "o": ["It includes routing protocol packets.", "It is traffic destined for the Routing Engine.", "It does not require control plane processing.", "It is forwarded by the Packet Forwarding Engine."], "a": [2, 3]}, {"n": 18, "d": 1, "t": "What are two functions of the Routing Engine? (Choose two.)", "o": ["It evaluates firewall filters for transit traffic.", "It runs Junos OS.", "It processes all management traffic.", "It processes transit traffic."], "a": [1, 2]}, {"n": 19, "d": 2, "t": "Which interface type prefix represents a 10-Gigabit Ethernet interface?", "o": ["ge", "xe", "et", "fe"], "a": [1]}, {"n": 20, "d": 3, "t": "A network administrator must set up the initial configuration of the out-of-band management interface on a new Juniper router to ensure management traffic is isolated from the default routing table (inet.0). In this scenario, which configuration step is required to accomplish this task in Junos OS?", "o": ["Configure an IP address on interface ge-0/0/0.0 and enable ethernet-switching family.", "Configure the lo0.0 loopback interface with a management IP and apply it to the [edit system services] hierarchy.", "Assign an IP address to the me0.0 interface and set the routing-options to instance-type virtual-router.", "Assign an IP address to interface fxp0.0 or em0.0 and use the command set system management-instance to enable the management routing instance."], "a": [3]}, {"n": 21, "d": 2, "t": "Click the Exhibit button. The MX204 has 12 built-in ports. Referring to the exhibit, to which interface does the arrow point?", "o": ["xe-0/2/7", "xe-0/0/7", "xe-0/1/7", "xe-0/1/6"], "a": [2], "x": "[Gambar] Panel depan MX204 (PIC 0 dan PIC 1). Panah menunjuk ke port paling kanan di PIC 1."}, {"n": 22, "d": 1, "t": "Which two functions are performed by the PFE? (Choose two.)", "o": ["It processes exception traffic.", "It forwards incoming traffic.", "It creates the forwarding table.", "It creates the routing table."], "a": [0, 1]}, {"n": 23, "d": 1, "t": "Which two statements correctly describe how Junos OS handles control and forwarding functions? (Choose two.)", "o": ["The Packet Forwarding Engine (PFE) forwards packets based on forwarding tables received from the Routing Engine.", "Exception traffic is always dropped by the Packet Forwarding Engine without being inspected.", "Transit traffic is processed by the Routing Engine to ensure high-speed packet forwarding.", "The Routing Engine (RE) is responsible for maintaining routing tables and running routing protocols."], "a": [0, 3]}, {"n": 24, "d": 3, "t": "A security policy requires that a user account be created for auditing purposes. This user should only view configuration and operational data without making any changes. Which predefined login class would satisfy this requirement?", "o": ["operator", "unauthorized", "read-only", "super-user"], "a": [2]}, {"n": 25, "d": 4, "t": "When troubleshooting a problem, you issue the following commands in sequence:\n1. show chassis alarms\n2. show chassis fpc\n3. show chassis fpc detail\n4. show chassis errors fpc-slot 0\nIn this scenario, what happens when you press the up arrow key twice at the prompt?", "o": ["The show chassis fpc command is displayed at the prompt.", "The show chassis errors fpc-slot 0 command is displayed at the prompt.", "The show chassis alarms command is displayed at the prompt.", "The show chassis fpc detail command is displayed at the prompt."], "a": [3]}, {"n": 26, "d": 3, "t": "You have configured multiple authentication methods on your Junos device, including RADIUS, TACACS+, and local user accounts. A user attempts to log in, but the RADIUS server is unavailable. Referring to the exhibit, which statement is correct?", "o": ["The user is prompted to select a different authentication method.", "The login attempt fails immediately.", "Junos will continue to attempt to authenticate with the RADIUS server until it responds.", "Junos attempts the next configured authentication method."], "a": [3], "x": "[edit]\nuser@router# show system\nhost-name router;\nauthentication-order [ radius tacplus password ];"}, {"n": 27, "d": 3, "t": "You are creating a new user account using a predefined login class on a Junos device. The account should be able to run operational mode commands such as show interfaces and ping, but should not be allowed to change or commit configuration. Which login class should you assign to this user?", "o": ["maintenance", "read-only", "super-user", "operator"], "a": [3]}, {"n": 28, "d": 2, "t": "What information would you find using the CLI help command?", "o": ["a URL for accessing the technical documentation", "message of the day", "hyperlinks for remediation actions", "an explanation for specific system log error messages"], "a": [0]}, {"n": 29, "d": 2, "t": "What does the Junos CLI prompt indicate when it ends with a hash symbol (#)?", "o": ["The user is in operational mode.", "The user is in configuration mode.", "The user is in shell mode.", "The user is in recovery mode."], "a": [1]}, {"n": 30, "d": 3, "t": "Click the Exhibit button. Which command displays the output in the format shown in the exhibit?", "o": ["show configuration | display inheritance", "show configuration | display set", "show configuration", "show configuration | display detail"], "a": [1], "x": "set system services ssh root-login allow\nset system services netconf ssh\nset system services rest http port 3000\nset system services rest enable-explorer\nset system syslog user * any emergency\nset system syslog file messages any notice\nset system syslog file messages authorization info\nset system syslog file interactive-commands interactive-commands any"}, {"n": 31, "d": 3, "t": "You committed a new configuration on a Junos router, but users report connectivity issues. You must quickly restore the previous working configuration without manually editing the candidate configuration. Which command should you use to load the required configuration into the candidate configuration?", "o": ["rollback 0", "show | compare rollback", "rollback 1", "load override"], "a": [2]}, {"n": 32, "d": 2, "t": "Which command would compare the candidate configuration with the active configuration before committing the changes?", "o": ["user@router# show | compare", "user@router# rollback 0", "user@router> show configuration | compare rollback 0", "user@router> show configuration | compare"], "a": [0]}, {"n": 33, "d": 3, "t": "You successfully committed a configuration change. You now realize an issue exists and must revert back to the previous configuration. Which command entered in configuration mode will accomplish this task when committed?", "o": ["show | compare", "save config", "rollback 0", "rollback 1"], "a": [3]}, {"n": 34, "d": 3, "t": "You are using the factory default configuration on a new Juniper router. You must successfully commit the configuration and activate the device. Which component must be configured before Junos OS will allow you to accomplish this task?", "o": ["a system hostname", "a root-authentication password", "at least one logical interface with family inet enabled", "a management IP address on the fxp0 interface"], "a": [1]}, {"n": 35, "d": 3, "t": "You are configuring a new router and want to ensure that you can recover from future misconfigurations. In this scenario, what should you do after completing the initial configuration?", "o": ["Update the firmware on the router.", "Save the configuration as rollback 0.", "Create a rescue configuration.", "Enable automatic rollback after 10 minutes."], "a": [2]}, {"n": 36, "d": 3, "t": "Your switch01 device lost network connectivity after a configuration change. You must recover the device to a known working state using the rescue configuration that was previously saved. The device is only accessible using the console. In this scenario, which command sequence will successfully restore the rescue configuration?", "o": ["user@switch01> configure\nuser@switch01# load override rescue\nuser@switch01# commit", "user@switch01> request system configuration rescue delete\nuser@switch01> reboot", "user@switch01> configure\nuser@switch01# rollback rescue load complete\nuser@switch01# commit", "user@switch01> request system configuration rescue save\nuser@switch01> configure\nuser@switch01# commit"], "a": [0]}, {"n": 37, "d": 3, "t": "You must add a large hierarchical configuration to your Junos device. You also want to completely replace the existing candidate configuration with a new configuration file. Which command would allow you to accomplish these tasks?", "o": ["load merge terminal", "load override terminal", "load factory default", "load set terminal"], "a": [1]}, {"n": 38, "d": 5, "t": "Which two statements are correct about logical units? (Choose two.)", "o": ["A physical interface can host multiple logical units.", "Logical units can have multiple IP addresses.", "Logical units are used only for management interfaces.", "A physical interface can host only one logical unit."], "a": [0, 1]}, {"n": 39, "d": 3, "t": "Your system administrator notified the infrastructure team that all server NICs will be moving to jumbo frames. All of the NICs used by servers are 1 gigabit. The starting frame size will be 4K. The exact frame size may change depending on testing results. In this scenario, which choice would provide a flexible solution?", "o": ["Create a group that adjusts MTU size on 1 gigabit interfaces and apply at the interfaces level.", "Apply the MTU to each interface family for each 1 gigabit interface.", "Set the app-engine compute-cluster Ethernet MTU size for the Junos VM.", "Use the system internet-options path-mtu-discovery to dynamically adjust MTU."], "a": [0]}, {"n": 40, "d": 3, "t": "You manage a Junos device with 20 interfaces. Each interface requires the same description and MTU setting. Which configuration approach would reduce repetitive commands and ensure consistency?", "o": ["Use the wildcard delete command to remove duplicate settings.", "Configure each interface individually.", "Use a configuration group.", "Use search and replace to apply settings across interfaces."], "a": [2]}, {"n": 41, "d": 4, "t": "You want to redeploy a Junos device by clearing the existing configuration and resetting it to factory defaults. In this scenario, which command would help to accomplish this task?", "o": ["show system storage", "request system storage cleanup dry-run", "request system zeroize", "request system storage cleanup"], "a": [2]}, {"n": 42, "d": 4, "t": "According to HPE Juniper Networking, what are two recommended tasks you should perform before upgrading Junos OS on a device? (Choose two.)", "o": ["Delete all rollback configurations.", "Verify available storage space using the show system storage command.", "Disable all interfaces to prevent traffic during the upgrade.", "Back up the active current configuration."], "a": [1, 3]}, {"n": 43, "d": 4, "t": "Your team alerts you that users connected to ge-0/0/5 are experiencing intermittent slowness. You log in to the switch and want to see live, real-time traffic updates for that interface to determine whether the link is being over-utilized. Which monitoring command should you use in this scenario?", "o": ["show chassis hardware", "monitor interface ge-0/0/5", "show interfaces terse", "show interfaces ge-0/0/5 extensive"], "a": [1]}, {"n": 44, "d": 4, "t": "What does the user@router> clear log ospf-trace command accomplish?", "o": ["The ospf-trace file is deleted.", "Trace parameters are removed from the OSPF protocol configuration.", "Logging data into ospf-trace is stopped.", "Data in the ospf-trace file is removed and logging continues."], "a": [3]}, {"n": 45, "d": 4, "t": "Which two actions does the monitor traffic command perform? (Choose two.)", "o": ["It provides access to the tcpdump utility.", "It monitors traffic that originates or terminates on the local PFE.", "It displays real-time log information on your terminal.", "It monitors traffic that originates or terminates on the local RE."], "a": [0, 3]}, {"n": 46, "d": 4, "t": "What are two requirements for root password recovery in Junos? (Choose two.)", "o": ["You must have console access to the device.", "You must have saved the rescue configuration in advance.", "You must load the factory default configuration.", "You must reboot the device."], "a": [0, 3]}, {"n": 47, "d": 4, "t": "Which two statements are correct about SNMPv3? (Choose two.)", "o": ["It uses plain-text community strings.", "It protects against tampering and eavesdropping.", "It is simpler to configure than SNMPv2C.", "It provides encrypted passwords for secure communication."], "a": [1, 3]}, {"n": 48, "d": 4, "t": "Which Junos tool should you use to identify the path that packets take through the network to a destination?", "o": ["monitor interface traffic", "traceroute", "SNMP", "ping"], "a": [1]}, {"n": 49, "d": 5, "t": "Click the Exhibit button. Referring to the exhibit using the show route 192.168.100.100 command output, over which interface will the traffic be forwarded?", "o": ["xe-0/1/3.0", "xe-0/0/0.0", "xe-0/1/4.0", "xe-0/1/2.0"  const q=qs[cur],m=q.a.length>1,s=ans[cur]||[],fb=sub||checked.has(cur);
 $('cn').textContent=cur+1;$('tn').textContent=qs.length;$('tn2').textContent=qs.length;
 $('qt').textContent='Question '+(cur+1)+' · No. asli '+q.n;
 $('bd').textContent=m?'Choose '+q.a.length+' (Multiple Select)':'Single Select';
 $('qx').textContent=q.t;const ex=$('ex');ex.style.display=q.x?'block':'none';ex.textContent=q.x||'';
 const c=$('opts');c.innerHTML='';
 q.o.forEach((t,i)=>{const l=document.createElement('label');l.className='opt';
  const inp=document.createElement('input');inp.type=m?'checkbox':'radio';inp.checked=s.includes(i);inp.disabled=fb;inp.onchange=()=>pick(i);
  if(fb){if(q.a.includes(i))l.classList.add('ok');else if(s.includes(i))l.classList.add('bad')}else if(s.includes(i))l.classList.add('sel');
  const b=document.createElement('b');b.textContent=String.fromCharCode(65+i)+'.';const sp=document.createElement('span');sp.textContent=t;
  l.append(inp,b,sp);c.appendChild(l)});
 const f=$('fb');if(fb){const L=q.a.map(i=>String.fromCharCode(65+i)).join(', '),g=ok(cur);f.style.display='block';f.className='fb '+(g?'g':'r');f.innerHTML=g?'<b>Jawaban benar</b> ('+L+')':'<b>Jawaban salah.</b> Kunci: <b>'+L+'</b>'}else f.style.display='none';
 $('st').textContent=s.length?'Answered':'Unanswered';$('fl').textContent=flags.has(cur)?'Yes':'No';
 $('fbtn').textContent=flags.has(cur)?'Unflag Question':'Flag for Review';$('un').textContent=na();
 $('prev').disabled=cur===0;$('next').disabled=cur===qs.length-1&&!(train&&!sub&&!checked.has(cur));$('jump').value=cur}
function fill(){$('jump').innerHTML=qs.map((_,i)=>'<option value="'+i+'">Soal '+(i+1)+'</option>').join('')}
function flag(){flags.has(cur)?flags.delete(cur):flags.add(cur);render()}
function toggleTrain(){train=!train;$('tbtn').textContent='Training Mode: '+(train?'ON':'OFF');$('tbtn').className=train?'on':'';render()}
function shuffle(){if(mode==='seq'){alert('Mode Urut Nomor tidak diacak. Pakai Latihan 95 Soal untuk soal acak.');return}if(sub){alert('Ujian sudah selesai. Gunakan tombol di laporan skor untuk mengulang.');return}build();cur=0;ans={};flags.clear();checked.clear();fill();render()}
function filt(t){if(t==='all')return;const n=qs.length;for(let k=1;k<=n;k++){const i=(cur+k)%n;if(t==='un'?!(ans[i]||[]).length:wrong.has(i)){go(i);return}}alert('Tidak ada soal di kategori ini.')}
function review(){const m=$('modal');if(m.style.display==='flex'){m.style.display='none';return}
 $('grid').innerHTML='';qs.forEach((_,i)=>{const b=document.createElement('button');b.textContent=(i+1);
  if(sub&&wrong.has(i))b.className='w';else if((ans[i]||[]).length)b.className='a';
  if(flags.has(i))b.classList.add('f');if(i===cur)b.classList.add('c');
  b.onclick=()=>{m.style.display='none';go(i)};$('grid').appendChild(b)});m.style.display='flex'}
function submit(){if(sub)return;const u=na();if(!confirm(u?'Masih ada '+u+' soal belum terjawab. Yakin selesai?':'Yakin mengakhiri ujian?'))return;finish()}
function finish(){
 sub=true;wrong.clear();let c=0;const st={};
 qs.forEach((q,i)=>{st[q.d]=st[q.d]||{t:0,c:0};st[q.d].t++;if(ok(i)){c++;st[q.d].c++}else wrong.add(i)});
 const p=Math.round(c/qs.length*100),pass=p>=85,full=mode!=='retry';
 let h='<div class="bar"><div><b style="font-size:17px">'+(full?(mode==='seq'?'LATIHAN URUT NOMOR · SCORE REPORT':mode==='sim'?'SIMULASI UJIAN JN0-106 · SCORE REPORT':'JUNIPER NETWORKS EXAM SCORE REPORT'):'HASIL ULANG SOAL SALAH (Ronde '+round+')')+'</b><br><small>Exam Code: JN0-106 (JNCIA-Junos) · Created by Mas Way</small></div><div class="big" style="color:'+(full?(pass?'#059669':'#e11d48'):'#0369a1')+'">'+(full?(pass?'PASS':'FAIL'):c+'/'+qs.length)+'</div></div>';
 h+=full?'<p>Passing grade 85% (min. '+Math.ceil(qs.length*.85)+'/'+qs.length+') &nbsp;|&nbsp; Skor Anda: <b class="big">'+p+'%</b> ('+c+' / '+qs.length+' benar)</p>':'<p>Skor ronde ini: <b class="big">'+p+'%</b> ('+c+' / '+qs.length+' benar)'+(wrong.size?'':' — semua soal sudah benar!')+'</p>';
 h+='<b>Performa per domain</b>';
 for(let d=1;d<=5;d++){const s=st[d]||{t:0,c:0},x=s.t?Math.round(s.c/s.t*100):0;h+='<div style="margin-top:8px;font-size:12px">'+DOM[d]+' — '+x+'% ('+s.c+'/'+s.t+')</div><div class="pb"><i style="width:'+x+'%"></i></div>'}
 h+='<div class="row" style="margin-top:14px">'+(wrong.size?'<button class="amber" onclick="retry()">Ulangi Soal Salah ('+wrong.size+')</button>':'')+'<button class="green" onclick="newSim()">Simulasi Ujian (65 soal)</button><button onclick="newFull()">Latihan 95 Soal</button><button onclick="newSeq()">Latihan Urut Nomor</button></div>';
 $('rep').innerHTML=h;$('rep').style.display='block';$('wbtn').style.display='inline-block';$('wc').textContent=wrong.size;
 $('sbtn').disabled=true;render();$('rep').scrollIntoView()}
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function startRound(t,secs){cur=0;ans={};flags.clear();checked.clear();wrong.clear();sub=false;timed=t;if(t)left=secs;build(mode!=='seq');
 $('rep').style.display='none';$('sbtn').disabled=false;$('wbtn').style.display='none';
 $('rd').textContent=mode==='seq'?'Latihan urut nomor ('+qs.length+' soal)':mode==='retry'?'Ulang soal salah · Ronde '+round:mode==='sim'?'Simulasi ujian ('+qs.length+' soal · 90 menit)':'Ujian penuh ('+qs.length+' soal)';
 $('timer').textContent=t?fmt(secs):'Latihan';
 fill();render();window.scrollTo(0,0);document.querySelector('main').scrollTop=0}
function retry(){src=qs.filter((_,i)=>wrong.has(i));round++;mode='retry';startRound(false)}
function busy(){return!sub&&Object.keys(ans).length>0&&!confirm('Mulai ujian baru? Progres sekarang akan hilang.')}
function newSeq(){if(busy())return;src=D;round=0;mode='seq';startRound(false)}
function newFull(){if(busy())return;src=D;round=0;mode='full';startRound(true,3600)}
function newSim(){if(busy())return;src=shuf(D.slice()).slice(0,65);round=0;mode='sim';startRound(true,5400)}
setInterval(()=>{if(sub||!timed)return;if(left<=0){alert('Waktu ujian habis!');finish();return}left--;$('timer').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0')},1000);
build();fill();render();
</script></body></html>
